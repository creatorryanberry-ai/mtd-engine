services:
  pgdb:
    image: pgvector/pgvector:pg16
    shm_size: 1g
    restart: always
    healthcheck:
      test: 'pg_isready -U user --dbname=postgres'
      interval: 1s
      timeout: 5s
      retries: 10
    ports:
      - "${VITE_PORT_POSTGRES:-5433}:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
    command: |
      postgres
      -c max_connections=256
      -c log_error_verbosity=terse
      -c log_min_messages=fatal
      -c idle_in_transaction_session_timeout=300000
      -c statement_timeout=60000
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=3
    # for verbose logging when debugging (uncomment as needed):
      # -c log_error_verbosity=default
      # -c log_min_messages=info
      # -c log_statement=all
      # -c log_connections=on
      # -c log_disconnections=on
      # -c log_duration=on
      # -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    volumes:
      - pgdb_data:/var/lib/postgresql/data
      - ./src/database/:/docker-entrypoint-initdb.d

  # migrations run natively via `bun db:migrate` - no docker needed

  minio:
    image: minio/minio
    restart: always
    entrypoint: sh
    # create the 'chat' bucket before starting the service
    command: -c 'mkdir -p /data/chat && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "${VITE_PORT_MINIO:-9200}:9000"
      - "${VITE_PORT_MINIO_CONSOLE:-9201}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/.done"]
      interval: 2s
      timeout: 2s
      retries: 1
      start_period: 30s
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 minio minio_password; do
          echo 'Waiting for MinIO...';
          sleep 1;
        done &&
        mc mb --ignore-existing local/chat &&
        mc anonymous set download local/chat &&
        echo '✅ MinIO chat bucket ready and public' &&
        touch /tmp/.done &&
        sleep infinity;
      "

volumes:
  pgdb_data:
  minio_data:
