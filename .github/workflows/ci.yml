name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: "!contains(github.event.commits[0].message, 'docs:')"
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Check
        run: bun check

  integration:
    if: "!contains(github.event.commits[0].message, 'docs:')"
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      # playwright drives system chrome (PLAYWRIGHT_CHANNEL=chrome) to avoid the
      # bundled-chromium install hanging during extraction. ensure chrome exists.
      - name: Ensure Google Chrome
        env:
          NEEDRESTART_MODE: a
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Integration Tests
        run: bun scripts/test/integration.ts
        env:
          # 🔒 start - this is generated by "bun env:update"
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALLOW_DEMO_AUTH: ${{ secrets.ALLOW_DEMO_AUTH }}
          ALLOW_MISSING_ENV: ${{ secrets.ALLOW_MISSING_ENV }}
          ALLOW_PUBLIC_AUTH: ${{ secrets.ALLOW_PUBLIC_AUTH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_SERVER_URL: ${{ secrets.API_SERVER_URL }}
          APNS_ENDPOINT: ${{ secrets.APNS_ENDPOINT }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_DB: ${{ secrets.DEPLOY_DB }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOYMENT_ARCH: ${{ secrets.DEPLOYMENT_ARCH }}
          DEPLOYMENT_PLATFORM: ${{ secrets.DEPLOYMENT_PLATFORM }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENABLE_API_DOCS: ${{ secrets.ENABLE_API_DOCS }}
          ENGINE_ENABLED: ${{ secrets.ENGINE_ENABLED }}
          ENGINE_LLM_FAST_MODEL: ${{ secrets.ENGINE_LLM_FAST_MODEL }}
          ENGINE_LLM_STRATEGY_MODEL: ${{ secrets.ENGINE_LLM_STRATEGY_MODEL }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          GCS_RECEIPTS_BUCKET: ${{ secrets.GCS_RECEIPTS_BUCKET }}
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HMRC_ACCOUNT_URL: ${{ secrets.HMRC_ACCOUNT_URL }}
          HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
          HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
          HMRC_ENV: ${{ secrets.HMRC_ENV }}
          HMRC_NATIVE_REDIRECT_URI: ${{ secrets.HMRC_NATIVE_REDIRECT_URI }}
          HMRC_REDIRECT_URI: ${{ secrets.HMRC_REDIRECT_URI }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          HUBSPOT_REDIRECT_URI: ${{ secrets.HUBSPOT_REDIRECT_URI }}
          INBOUND_EMAIL_DOMAIN: ${{ secrets.INBOUND_EMAIL_DOMAIN }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PUBLIC_URL: ${{ secrets.MINIO_PUBLIC_URL }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          ONECHAT_GITHUB_CLIENT_ID: ${{ secrets.ONECHAT_GITHUB_CLIENT_ID }}
          POSTMARK_FROM_EMAIL: ${{ secrets.POSTMARK_FROM_EMAIL }}
          POSTMARK_INBOUND_WEBHOOK_PASSWORD: ${{ secrets.POSTMARK_INBOUND_WEBHOOK_PASSWORD }}
          POSTMARK_INBOUND_WEBHOOK_USER: ${{ secrets.POSTMARK_INBOUND_WEBHOOK_USER }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TRANSACTION_WINDOW_DAYS: ${{ secrets.TRANSACTION_WINDOW_DAYS }}
          VITE_ALLOW_PUBLIC_AUTH: ${{ secrets.VITE_ALLOW_PUBLIC_AUTH }}
          VITE_API_HOSTNAME: ${{ secrets.VITE_API_HOSTNAME }}
          VITE_DEMO_MODE: ${{ secrets.VITE_DEMO_MODE }}
          VITE_ENGINE_ENABLED: ${{ secrets.VITE_ENGINE_ENABLED }}
          VITE_PORT_MINIO: ${{ secrets.VITE_PORT_MINIO }}
          VITE_PORT_POSTGRES: ${{ secrets.VITE_PORT_POSTGRES }}
          VITE_PORT_WEB: ${{ secrets.VITE_PORT_WEB }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_PROTOCOL: ${{ secrets.VITE_PROTOCOL }}
          VITE_WEB_HOSTNAME: ${{ secrets.VITE_WEB_HOSTNAME }}
          # 🔒 end - this is generated by "bun env:update"

  deploy:
    needs: [check, integration]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.commits[0].message, 'docs:')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GIT_SHA: ${{ github.sha }}
      # 🔒 start - this is generated by "bun env:update"
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ALLOW_DEMO_AUTH: ${{ secrets.ALLOW_DEMO_AUTH }}
          ALLOW_MISSING_ENV: ${{ secrets.ALLOW_MISSING_ENV }}
          ALLOW_PUBLIC_AUTH: ${{ secrets.ALLOW_PUBLIC_AUTH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_SERVER_URL: ${{ secrets.API_SERVER_URL }}
          APNS_ENDPOINT: ${{ secrets.APNS_ENDPOINT }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_DB: ${{ secrets.DEPLOY_DB }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOYMENT_ARCH: ${{ secrets.DEPLOYMENT_ARCH }}
          DEPLOYMENT_PLATFORM: ${{ secrets.DEPLOYMENT_PLATFORM }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ENABLE_API_DOCS: ${{ secrets.ENABLE_API_DOCS }}
          ENGINE_ENABLED: ${{ secrets.ENGINE_ENABLED }}
          ENGINE_LLM_FAST_MODEL: ${{ secrets.ENGINE_LLM_FAST_MODEL }}
          ENGINE_LLM_STRATEGY_MODEL: ${{ secrets.ENGINE_LLM_STRATEGY_MODEL }}
          GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
          GCS_RECEIPTS_BUCKET: ${{ secrets.GCS_RECEIPTS_BUCKET }}
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HMRC_ACCOUNT_URL: ${{ secrets.HMRC_ACCOUNT_URL }}
          HMRC_CLIENT_ID: ${{ secrets.HMRC_CLIENT_ID }}
          HMRC_CLIENT_SECRET: ${{ secrets.HMRC_CLIENT_SECRET }}
          HMRC_ENV: ${{ secrets.HMRC_ENV }}
          HMRC_NATIVE_REDIRECT_URI: ${{ secrets.HMRC_NATIVE_REDIRECT_URI }}
          HMRC_REDIRECT_URI: ${{ secrets.HMRC_REDIRECT_URI }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          HUBSPOT_REDIRECT_URI: ${{ secrets.HUBSPOT_REDIRECT_URI }}
          INBOUND_EMAIL_DOMAIN: ${{ secrets.INBOUND_EMAIL_DOMAIN }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_PUBLIC_URL: ${{ secrets.MINIO_PUBLIC_URL }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          ONE_SERVER_URL: ${{ secrets.ONE_SERVER_URL }}
          ONECHAT_GITHUB_CLIENT_ID: ${{ secrets.ONECHAT_GITHUB_CLIENT_ID }}
          POSTMARK_FROM_EMAIL: ${{ secrets.POSTMARK_FROM_EMAIL }}
          POSTMARK_INBOUND_WEBHOOK_PASSWORD: ${{ secrets.POSTMARK_INBOUND_WEBHOOK_PASSWORD }}
          POSTMARK_INBOUND_WEBHOOK_USER: ${{ secrets.POSTMARK_INBOUND_WEBHOOK_USER }}
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TRANSACTION_WINDOW_DAYS: ${{ secrets.TRANSACTION_WINDOW_DAYS }}
          VITE_ALLOW_PUBLIC_AUTH: ${{ secrets.VITE_ALLOW_PUBLIC_AUTH }}
          VITE_API_HOSTNAME: ${{ secrets.VITE_API_HOSTNAME }}
          VITE_DEMO_MODE: ${{ secrets.VITE_DEMO_MODE }}
          VITE_ENGINE_ENABLED: ${{ secrets.VITE_ENGINE_ENABLED }}
          VITE_PORT_MINIO: ${{ secrets.VITE_PORT_MINIO }}
          VITE_PORT_POSTGRES: ${{ secrets.VITE_PORT_POSTGRES }}
          VITE_PORT_WEB: ${{ secrets.VITE_PORT_WEB }}
          VITE_POSTHOG_API_KEY: ${{ secrets.VITE_POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_PROTOCOL: ${{ secrets.VITE_PROTOCOL }}
          VITE_WEB_HOSTNAME: ${{ secrets.VITE_WEB_HOSTNAME }}
      # 🔒 end - this is generated by "bun env:update"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/actions/install

      - name: Validate deploy secrets
        run: bun scripts/ops/validate-deploy-secrets.ts

      - name: Deploy to production
        run: NODE_ENV=production bun scripts/ops/release.ts --skip-tests
