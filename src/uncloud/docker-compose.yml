# uncloud deployment
# supports both self-hosted db (default) and external managed db
# use DB_EXTERNAL=true to skip pgdb service and use DATABASE_URL from env

x-app-env: &app-env
  GIT_SHA: ${GIT_SHA:-unknown}
  # 🔒 start - this is generated by "bun env:update"
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ALLOW_DEMO_AUTH: ${ALLOW_DEMO_AUTH:-}
  ALLOW_MISSING_ENV: ${ALLOW_MISSING_ENV:-}
  ALLOW_PUBLIC_AUTH: ${ALLOW_PUBLIC_AUTH:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  API_SERVER_URL: ${API_SERVER_URL:-}
  APNS_ENDPOINT: ${APNS_ENDPOINT:-https://api.sandbox.push.apple.com}
  APNS_KEY: ${APNS_KEY:-}
  APNS_KEY_ID: ${APNS_KEY_ID:-}
  APNS_TEAM_ID: ${APNS_TEAM_ID:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
  DATABASE_URL: ${DATABASE_URL:-}
  DEPLOY_DB: ${DEPLOY_DB:-}
  DEPLOY_HOST: ${DEPLOY_HOST:-}
  DEPLOY_SSH_KEY: ${DEPLOY_SSH_KEY:-}
  DEPLOY_USER: ${DEPLOY_USER:-root}
  DEPLOYMENT_ARCH: ${DEPLOYMENT_ARCH:-linux/amd64}
  DEPLOYMENT_PLATFORM: ${DEPLOYMENT_PLATFORM:-uncloud}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ENABLE_API_DOCS: ${ENABLE_API_DOCS:-}
  ENGINE_ENABLED: ${ENGINE_ENABLED:-}
  ENGINE_LLM_FAST_MODEL: ${ENGINE_LLM_FAST_MODEL:-claude-haiku-5-5}
  ENGINE_LLM_STRATEGY_MODEL: ${ENGINE_LLM_STRATEGY_MODEL:-claude-opus-5-5}
  GCS_PROJECT_ID: ${GCS_PROJECT_ID:-}
  GCS_RECEIPTS_BUCKET: ${GCS_RECEIPTS_BUCKET:-}
  GCS_SERVICE_ACCOUNT_JSON: ${GCS_SERVICE_ACCOUNT_JSON:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  HIGGSFIELD_API_KEY: ${HIGGSFIELD_API_KEY:-}
  HMRC_ACCOUNT_URL: ${HMRC_ACCOUNT_URL:-https://www.tax.service.gov.uk/account}
  HMRC_CLIENT_ID: ${HMRC_CLIENT_ID:-}
  HMRC_CLIENT_SECRET: ${HMRC_CLIENT_SECRET:-}
  HMRC_ENV: ${HMRC_ENV:-sandbox}
  HMRC_NATIVE_REDIRECT_URI: ${HMRC_NATIVE_REDIRECT_URI:-straightuptax://hmrc/callback}
  HMRC_REDIRECT_URI: ${HMRC_REDIRECT_URI:-}
  HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
  HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
  HUBSPOT_REDIRECT_URI: ${HUBSPOT_REDIRECT_URI:-}
  INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-inbox.straightup.tax}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
  ONE_SERVER_URL: ${ONE_SERVER_URL:-}
  ONECHAT_GITHUB_CLIENT_ID: ${ONECHAT_GITHUB_CLIENT_ID:-Iv23liNaYfNSauaySodL}
  POSTMARK_FROM_EMAIL: ${POSTMARK_FROM_EMAIL:-hello@straightup.tax}
  POSTMARK_INBOUND_WEBHOOK_PASSWORD: ${POSTMARK_INBOUND_WEBHOOK_PASSWORD:-}
  POSTMARK_INBOUND_WEBHOOK_USER: ${POSTMARK_INBOUND_WEBHOOK_USER:-}
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  TRANSACTION_WINDOW_DAYS: ${TRANSACTION_WINDOW_DAYS:-90}
  VITE_ALLOW_PUBLIC_AUTH: ${VITE_ALLOW_PUBLIC_AUTH:-}
  VITE_API_HOSTNAME: ${VITE_API_HOSTNAME:-}
  VITE_DEMO_MODE: ${VITE_DEMO_MODE:-}
  VITE_ENGINE_ENABLED: ${VITE_ENGINE_ENABLED:-}
  VITE_PORT_MINIO: ${VITE_PORT_MINIO:-}
  VITE_PORT_POSTGRES: ${VITE_PORT_POSTGRES:-}
  VITE_PORT_WEB: ${VITE_PORT_WEB:-}
  VITE_POSTHOG_API_KEY: ${VITE_POSTHOG_API_KEY:-}
  VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
  VITE_PROTOCOL: ${VITE_PROTOCOL:-}
  VITE_WEB_HOSTNAME: ${VITE_WEB_HOSTNAME:-}
  # 🔒 end - this is generated by "bun env:update"

services:
  pgdb:
    image: pgvector/pgvector:pg16
    shm_size: 1g
    restart: always
    stop_grace_period: 60s
    stop_signal: SIGTERM
    profiles:
      - self-hosted-db
    healthcheck:
      test: 'pg_isready -U ${POSTGRES_USER:-user} --dbname=${POSTGRES_DB:-postgres}'
      interval: 1s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    command: |
      postgres
      -c max_connections=256
    configs:
      - source: db_init
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - pgdb_data:/var/lib/postgresql/data

  web:
    image: mtd-web:latest
    restart: always
    x-ports:
      - ${VITE_WEB_HOSTNAME:-mtd.uncld.dev}:8081/https
    environment:
      <<: *app-env
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # standalone api process (bundled dist/api.js — see Dockerfile). serves /api/**
  # from its own container/subdomain, independent of the web `one serve` service.
  # start-first: new replica must pass healthcheck before the old one stops (zero downtime).
  # future: replicas: 2 when VMs have enough RAM/disk — see docs/deploy-uncloud.md.
  api:
    image: mtd-web:latest
    restart: always
    command: ["bun", "run", "dist/api.js"]
    x-ports:
      - ${VITE_API_HOSTNAME:-api.mtd.uncld.dev}:8081/https
    deploy:
      replicas: 1
      update_config:
        order: start-first
        monitor: 30s
    environment:
      <<: *app-env
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: mtd-web:latest
    restart: always
    # runs the pre-bundled worker (see Dockerfile) which resolves the
    # `server-only` marker to a no-op and tree-shakes client code
    command: ["bun", "run", "dist/worker.js"]
    environment:
      <<: *app-env
      NODE_ENV: production

volumes:
  pgdb_data:

configs:
  # path is relative to this compose file (src/uncloud/); ships init.sql to the
  # target's postgres initdb.d so pg_trgm is created on first db init
  db_init:
    file: ../database/init.sql
